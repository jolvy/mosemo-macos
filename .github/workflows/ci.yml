name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mosemo-macos
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Check out macOS client
        uses: actions/checkout@v4
        with:
          path: mosemo-macos

      - name: Check out server OpenAPI contract
        uses: actions/checkout@v4
        with:
          repository: jolvy/mosemo
          path: mosemo-server
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve exact dependencies
        run: swift package resolve

      - name: Generate and verify OpenAPI client
        run: |
          cp ../mosemo-server/openapi/openapi.json ../openapi.json
          scripts/update_openapi.sh
          git diff --exit-code -- Sources/MosemoAPI/GeneratedSources

      - name: Privacy boundary
        run: scripts/check_collector_privacy.sh

      - name: Xcode Debug build
        run: >-
          xcodebuild
          -project Mosemo.xcodeproj
          -scheme Mosemo
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Xcode Release archive
        run: >-
          xcodebuild
          -project Mosemo.xcodeproj
          -scheme Mosemo
          -configuration Release
          -archivePath "$RUNNER_TEMP/Mosemo.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          MOSEMO_API_BASE_URL=https://api.example.invalid
          archive
