<main><h1>관찰 타임라인</h1><p class="muted">하루의 활동과 관찰하지 못한 시간을 살펴봅니다.</p><div class="toolbar"><button disabled>‹</button><strong>2026. 9. 29.</strong><button disabled>›</button><button disabled>오늘</button><button disabled>새로고침</button><span class="muted" style="font-size:12px">Asia/Seoul 기준</span><span class="spacer"></span><span class="muted">보기</span><div class="mode"><button disabled>목록</button><button class="active">시간축</button></div></div><div class="workspace"><section id="timeline"></section><section id="inspector" class="inspector" aria-label="타임라인 상세"></section></div><details class="state"><summary>프로토타입 상태 · 화면 이동: URL의 time=9 또는 time=16</summary><pre id="state"></pre></details></main>

<script>
const seconds=t=>{const [h,m,s]=t.split(':').map(Number);return h*3600+m*60+s};
const duration=(start,end)=>{let n=seconds(end)-seconds(start);return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(v=>String(v).padStart(2,'0')).join(':')};
const px=t=>seconds(t)*110/3600;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const E=(start,end,kind,title,url)=>({start,end,kind,title,url});
const S=(id,start,end,label,color,entries,group)=>({id,start,end,label,color,entries,group,duration:duration(start,end)});
const background=prefix=>[
 S(prefix+'-morning-code','07:42:00','08:12:00','코딩','#83dfd1',[
  E('07:42:00','07:55:00','앱','Mosemo — Xcode'),E('07:55:00','08:12:00','웹','Mosemo API · GitHub','https://github.com/mosemo/mosemo-server')]),
 S(prefix+'-review','08:14:00','08:35:00','코드 검토','#83dfd1',[
  E('08:14:00','08:25:00','웹','Pull request #42 · GitHub','https://github.com/mosemo/mosemo-macos/pull/42'),E('08:25:00','08:35:00','앱','Mosemo — Xcode')]),
 S(prefix+'-chat','08:39:00','08:51:00','소통','#92abed',[E('08:39:00','08:51:00','앱','#개발 — Mosemo — Slack')]),
 S(prefix+'-research','09:12:00','09:34:00','자료 조사','#c8a8e8',[
  E('09:12:00','09:21:00','웹','SwiftUI · Apple Developer','https://developer.apple.com/documentation/swiftui'),E('09:21:00','09:34:00','웹','Layout fundamentals · Apple Developer','https://developer.apple.com/documentation')]),
 S(prefix+'-design','09:37:00','10:05:00','설계','#e0bb7d',[
  E('09:37:00','09:48:00','앱','타임라인 초안 — Figma'),E('09:48:00','09:59:00','웹','Mosemo 화면 설계 · Figma','https://www.figma.com/'),E('09:59:00','10:05:00','앱','Mosemo — Notes')]),
 S(prefix+'-calendar','10:05:00','10:08:00','소통','#92abed',[E('10:05:00','10:08:00','앱','오늘 일정 — Calendar')]),
 S(prefix+'-deep-code','10:15:00','10:48:00','코딩','#83dfd1',[
  E('10:15:00','10:27:00','앱','TimelineView.swift — Xcode'),E('10:27:00','10:34:00','웹','SwiftUI GeometryReader · Apple Developer','https://developer.apple.com/documentation/swiftui/geometryreader'),E('10:34:00','10:48:00','앱','TimelineView.swift — Xcode')]),
 S(prefix+'-unclassified','11:05:00','11:25:00','미분류','#aeb4bd',[
  E('11:05:00','11:14:00','웹','검색 결과 — Chrome','https://www.google.com/search?q=swiftui+timeline'),E('11:14:00','11:25:00','앱','문서 초안 — Notes')]),
 S(prefix+'-lunch','12:10:00','12:37:00','여가','#e5b49f',[E('12:10:00','12:37:00','앱','오늘의 추천 — Music')]),
 S(prefix+'-afternoon-code','13:07:00','13:58:00','코딩','#83dfd1',[
  E('13:07:00','13:25:00','앱','TimelineView.swift — Xcode'),E('13:25:00','13:36:00','웹','Issue #28 · GitHub','https://github.com/mosemo/mosemo-macos/issues/28'),E('13:36:00','13:58:00','앱','Mosemo — Xcode')]),
 S(prefix+'-planning','14:04:00','14:27:00','기획','#e0bb7d',[E('14:04:00','14:16:00','앱','회의 메모 — Notes'),E('14:16:00','14:27:00','웹','타임라인 UI · Figma','https://www.figma.com/')]),
 S(prefix+'-docs','15:12:00','15:49:00','자료 조사','#c8a8e8',[E('15:12:00','15:30:00','웹','Human Interface Guidelines · Apple Developer','https://developer.apple.com/design/human-interface-guidelines/'),E('15:30:00','15:49:00','웹','Accessibility · Apple Developer','https://developer.apple.com/accessibility/')]),
 S(prefix+'-setup','15:55:00','15:59:00','코딩','#83dfd1',[E('15:55:00','15:59:00','앱','Mosemo — Xcode')]),
 S(prefix+'-late-a','16:09:00','16:09:07','코딩','#83dfd1',[E('16:09:00','16:09:07','앱','Mosemo — Xcode')],'late'),
 S(prefix+'-late-b','16:09:07','16:09:43','소통','#92abed',[E('16:09:07','16:09:43','앱','#개발 — Mosemo — Slack')],'late'),
 S(prefix+'-late-c','16:09:43','16:10:22','자료 조사','#c8a8e8',[E('16:09:43','16:10:22','웹','SwiftUI · Apple Developer','https://developer.apple.com/documentation/swiftui')],'late'),
 S(prefix+'-wrap','16:11:00','16:44:00','코딩','#83dfd1',[E('16:11:00','16:31:00','웹','PR 리뷰 · GitHub','https://github.com/mosemo/mosemo-macos/pulls'),E('16:31:00','16:44:00','앱','Mosemo — Xcode')]),
 S(prefix+'-end','17:03:00','17:38:00','기획','#e0bb7d',[E('17:03:00','17:18:00','앱','내일 할 일 — Notes'),E('17:18:00','17:38:00','웹','프로젝트 보드 · GitHub','https://github.com/mosemo')])
];
const day={id:'day',items:[...background('day'),
 S('day-morning-a','09:00:00','09:00:05','코딩','#83dfd1',[E('09:00:00','09:00:05','앱','Mosemo — Xcode')],'morning'),
 S('day-morning-b','09:00:05','09:00:55','소통','#92abed',[E('09:00:05','09:00:55','앱','#개발 — Mosemo — Slack')],'morning')
]};
day.items.sort((a,b)=>seconds(a.start)-seconds(b.start));
const hitboxes=new URLSearchParams(location.search).get('hitboxes')==='1';
document.body.classList.toggle('hitboxes',hitboxes);
const initialHour=Number(new URLSearchParams(location.search).get('time'))===16?16:9;
let variant=new URLSearchParams(location.search).get('variant')||'A';
let selected=hitboxes?'day-wrap':initialHour===16?'day-late-b':'day-morning-a',expanded=null;
if(!['A','B','C'].includes(variant))variant='A';
function groupItems(group){return day.items.filter(i=>i.group===group)}
function assignLanes(){const occupiedUntil=[],lanes={};for(const item of day.items){const top=px(item.start)-(item.group?3:0),height=item.group?20:Math.max(16,px(item.end)-px(item.start)-2);let lane=occupiedUntil.findIndex(end=>end<=top);if(lane<0)lane=occupiedUntil.length;occupiedUntil[lane]=top+height;lanes[item.id]=lane}return lanes}
function shortBar(item,lane){const top=px(item.start)-3;
 if(variant==='A')return `<button class="lane-button ${selected===item.id?'selected':''}" style="top:${top}px;left:${5+lane*35}px;width:29px;--bar:${item.color}" onclick="select('${item.id}')" aria-label="${item.start}–${item.end} ${esc(item.label)}" title="${item.start}–${item.end} · ${esc(item.label)}"></button>`;
 return `<button class="step-button ${selected===item.id?'selected':''}" style="top:${top+lane*22}px;--bar:${item.color}" onclick="select('${item.id}')" aria-label="${item.start}–${item.end} ${esc(item.label)}" title="${item.start}–${item.end} · ${esc(item.label)}"></button>`}
function normalBar(item,lane){const height=Math.max(16,px(item.end)-px(item.start)-2),shift=variant==='A'?lane*35:0;return `<button class="normal-button ${item.id==='day-wrap'?'collision-next':''} ${selected===item.id?'selected':''}" style="top:${px(item.start)}px;left:${5+shift}px;width:calc(min(70%, 520px) - ${shift}px);height:${height}px;--bar:${item.color}" onclick="select('${item.id}')" aria-label="${item.start}–${item.end} ${esc(item.label)}" title="${item.start}–${item.end} · ${esc(item.label)}"><strong>${esc(item.label)}</strong>${height>=36?`<div class="time">${item.start}–${item.end}</div>`:''}</button>`}
function marker(group){const items=groupItems(group),first=items[0],open=expanded===group;return `<button class="cluster-button ${open?'open':''}" style="top:${px(first.start)-3}px" onclick="toggle('${group}')" aria-expanded="${open}">${first.start.slice(0,5)} · ${items.length}개 구간 ${open?'−':'+'}</button>${open?`<div class="cluster-popover" style="top:${px(first.start)+27}px">${items.map(i=>`<button class="cluster-entry ${selected===i.id?'selected':''}" onclick="select('${i.id}')"><span>${i.start}–${i.end}</span><span>${esc(i.label)}</span><span class="length">${i.duration}</span></button>`).join('')}</div>`:''}`}
function timelineHtml(){const ticks=Array.from({length:24},(_,h)=>`<div class="tick" style="top:${h*110}px"><span>${String(h).padStart(2,'0')}:00</span></div>`).join('');const groups=new Set(),lanes=assignLanes();const bars=day.items.map(i=>{if(!i.group)return normalBar(i,lanes[i.id]);if(variant==='C'){if(groups.has(i.group))return '';groups.add(i.group);return marker(i.group)}return shortBar(i,lanes[i.id])}).join('');return `<div class="day-head"><h2>2026-09-29</h2><span>${hitboxes?'<span class="hitbox-note">점선: 20px 클릭 영역 · 겹치면 오른쪽 빈 칸 사용</span> · ':''}${day.items.length}개 표시 구간</span></div><div class="axis-scroll"><div class="axis">${ticks}${bars}</div></div>`}
function render(){const scroller=document.querySelector('.axis-scroll');const scrollTop=scroller?.scrollTop;document.querySelectorAll('[data-variant]').forEach(el=>el.classList.toggle('active',el.dataset.variant===variant));document.querySelector('#timeline').innerHTML=timelineHtml();document.querySelector('.axis-scroll').scrollTop=scrollTop??initialHour*110-120;const item=day.items.find(i=>i.id===selected);document.querySelector('#inspector').innerHTML=`<div class="summary"><div><div class="duration">${item.duration}</div><div class="range">2026. 9. 29. ${item.start} – ${item.end}</div></div><span class="pill">${esc(item.label)}</span></div><div class="items"><div class="items-head"><strong>타임라인</strong><span>${item.entries.length}개 항목</span></div><table class="detail-table"><thead><tr><th>총</th><th>시작시간</th><th>종료시간</th><th>종류</th><th>상세정보</th></tr></thead><tbody>${item.entries.map(e=>`<tr><td>${duration(e.start,e.end)}</td><td>${e.start}</td><td>${e.end}</td><td>${e.kind}</td><td>${esc(e.title)}${e.url?`<div class="url">${esc(e.url)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`;document.querySelector('#state').textContent=JSON.stringify({variant,selectedInterval:item,segments:day.items.map(i=>({start:i.start,end:i.end,label:i.label,entries:i.entries.length,group:i.group||null})),expanded},null,2)}
function select(id){selected=id;expanded=null;render()}
function toggle(id){expanded=expanded===id?null:id;render()}
function setVariant(value){variant=value;expanded=null;const url=new URL(location.href);url.searchParams.set('variant',value);history.replaceState(null,'',url);render()}
function cycle(dir){const keys=['A','B','C'];setVariant(keys[(keys.indexOf(variant)+dir+3)%3])}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('popstate',()=>{variant=new URLSearchParams(location.search).get('variant')||'A';render()});render();
</script></html>
