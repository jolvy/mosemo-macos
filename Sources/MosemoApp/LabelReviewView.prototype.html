<!doctype html>
<!-- THROWAWAY PROTOTYPE: grouped label review, three layouts via ?variant=A|B|C. In-memory sample data only. -->
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosemo · 라벨 검토 프로토타입</title>
<style>
:root{color-scheme:dark;--bg:#292a2d;--panel:#202124;--line:#45474b;--text:#ececef;--muted:#adafb6;--accent:#79ded0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit;cursor:pointer;border:1px solid #55585e;color:var(--text);background:#383a40;border-radius:7px;padding:8px 12px}button:hover{background:#484b52}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--accent);color:#142c28;border-color:var(--accent);font-weight:650}button.quiet{background:transparent}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}aside{position:fixed;inset:0 auto 0 0;width:205px;background:#15181f;padding:28px 16px}.brand{font-size:21px;font-weight:800;letter-spacing:3px;margin:0 12px 42px}.brand span{color:var(--accent)}.nav{padding:14px 12px;border-radius:9px;margin:7px 0;color:var(--muted)}.nav.active{background:#343741;color:white;font-weight:650}main{margin-left:205px;padding:36px 36px 145px;max-width:1650px}h1{font-size:30px;margin:0 0 9px}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0}p{line-height:1.6;margin:8px 0}.muted{color:var(--muted)}.notice{font-size:12px;color:#d3cfaa;border:1px solid #686247;background:#373429;padding:9px 12px;border-radius:7px;margin-bottom:22px}.top,.toolbar,.group-head,.actions,.item-head,.choice,.bar{display:flex;align-items:center;gap:12px}.top{justify-content:space-between}.toolbar{margin:25px 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}.toolbar .spacer,.group-head .spacer,.actions .spacer{flex:1}.group{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:16px 0;overflow:hidden}.group-head{padding:18px 20px;background:#303237;flex-wrap:wrap}.group-title{min-width:180px}.group-title small{display:block;color:var(--muted);margin-top:5px}.tag{font-size:12px;display:inline-block;padding:5px 8px;border-radius:5px;background:#35403c;color:#b4e8d0;white-space:nowrap}.tag.edited{background:#493e29;color:#efd39c}.tag.done{background:#233c3a;color:#8bdccc}.tag.ai{background:#343d51;color:#b2caff}.summary{font-size:12px;color:var(--muted)}.content{padding:0 20px 20px}.item{border-bottom:1px solid var(--line);padding:18px 0}.item:last-child{border-bottom:0}.item-head{align-items:flex-start}.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:105px;line-height:1.6}.identity{flex:1;min-width:0}.identity h3{line-height:1.5}.identity p{font-size:12px;color:var(--muted);margin:3px 0}.choice{flex-wrap:wrap;font-size:12px}.choice select{min-width:108px}.arrow{color:var(--muted)}details{margin-top:12px}summary{cursor:pointer;color:var(--accent);font-size:12px;width:max-content}.facts{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 14px;margin:18px 0;font-size:13px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere;line-height:1.5}.url{color:#a8c7ff}.missing{color:var(--muted);font-style:italic}.actions{margin-top:14px;font-size:12px}.check{accent-color:var(--accent);width:16px;height:16px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:20px}.card{background:#2b2d32;border:1px solid var(--line);border-radius:9px;padding:18px}.card .time{margin-top:4px}.card .facts{grid-template-columns:72px minmax(0,1fr);font-size:12px}.card .choice{border-top:1px solid var(--line);padding-top:14px}.split{display:grid;grid-template-columns:minmax(220px,36%) minmax(0,1fr);margin:20px 0 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}.segment-list{background:#27292e;border-right:1px solid var(--line)}.segment-button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-align:left;padding:16px}.segment-button.current{background:#344344;box-shadow:inset 3px 0 var(--accent)}.segment-button strong{display:block;line-height:1.5;margin:6px 0}.segment-button .tag{margin-top:5px}.inspector{padding:22px;background:#24262b}.inspector h3{font-size:18px;line-height:1.5}.inspector .choice{border-top:1px solid var(--line);padding-top:18px}.legend{font-size:12px;color:var(--muted);margin:12px 0}.switcher{position:fixed;bottom:24px;left:calc(50% + 80px);transform:translateX(-50%);z-index:10;background:#f0f2f3;color:#172223;border-radius:40px;box-shadow:0 8px 30px #0008;padding:8px;display:flex;align-items:center;gap:8px}.switcher button{color:#172223;background:transparent;border:0;border-radius:24px;padding:10px 14px}.switcher button.active{background:#173f39;color:#aaf1df}.switcher .cycle{font-size:18px}.state{margin-top:24px;background:#191b20;border:1px dashed #555b64;border-radius:8px;padding:14px;font-size:12px}.state pre{white-space:pre-wrap;color:#abb7bd;line-height:1.6;margin-bottom:0}.toast{position:fixed;top:20px;right:25px;background:#254b43;padding:13px 18px;border:1px solid var(--accent);border-radius:8px;z-index:20}#message:empty{display:none}@media(max-width:1050px){aside{width:165px}.brand{font-size:17px}main{margin-left:165px;padding:26px 20px 140px}.cards{grid-template-columns:1fr}.item-head{flex-wrap:wrap}.item-head .choice{width:100%;margin-left:117px}.switcher{left:calc(50% + 65px)}.group-head .spacer{display:none}}@media(max-width:760px){aside{display:none}main{margin-left:0}.split{grid-template-columns:1fr}.segment-list{border-right:0}.switcher{left:50%;font-size:12px}.switcher button{padding:8px}.toolbar{flex-wrap:wrap}.item-head .choice{margin-left:0}.group-head{gap:10px}}

.table-scroll{overflow-x:auto;padding-top:14px}.review-table{width:100%;min-width:1020px;border-collapse:collapse;table-layout:fixed;font-size:13px}.review-table th{text-align:left;font-weight:500;color:var(--muted);padding:12px 10px;border-bottom:1px solid var(--line);background:#292b30}.review-table td{vertical-align:top;padding:18px 10px;border-bottom:1px solid var(--line)}.review-table tbody tr:last-child td{border-bottom:0}.review-table tbody tr:hover{background:#292c31}.review-table th:nth-child(1){width:125px}.review-table th:nth-child(2){width:95px}.review-table th:nth-child(3){width:auto}.review-table th:nth-child(4){width:78px}.review-table th:nth-child(5){width:120px}.review-table th:nth-child(6){width:84px}.review-table th:nth-child(7){width:116px}.review-table .facts{grid-template-columns:56px minmax(0,1fr);gap:8px 10px;margin:10px 0 0;font-size:12px}.review-table h3{font-size:13px;line-height:1.5}.review-table .time{min-width:0;font-size:12px}.review-table select{width:100%;min-width:0}.review-table .primary{font-size:12px;white-space:nowrap}.review-table .tag{white-space:normal}.review-table .hint{color:#efd39c;font-size:11px;line-height:1.5;margin-top:8px}.review-table .duration{display:block;margin-top:6px;color:var(--muted)}

.tree-table{min-width:880px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.tree-table th:nth-child(1){width:42px}.tree-table th:nth-child(2){width:130px}.tree-table th:nth-child(3){width:auto}.tree-table th:nth-child(4){width:82px}.tree-table th:nth-child(5){width:118px}.tree-table th:nth-child(6){width:125px}.tree-table .parent-row td{vertical-align:middle;background:#34363c;padding-top:15px;padding-bottom:15px;border-top:1px solid #53555b}.tree-table .parent-row h3{font-size:14px}.tree-table .child-row td{background:#23252a}.tree-table .child-row:hover td{background:#2b2f33}.tree-table .selected-row td{background:#293936}.tree-table .tree-title{display:flex;gap:9px;align-items:center}.tree-table .tree-title button{padding:4px 7px;border:0;color:var(--accent)}.tree-table .branch{position:relative;padding-left:29px}.tree-table .branch:before{content:'';position:absolute;left:9px;top:-18px;bottom:-18px;border-left:1px solid #60656e}.tree-table .branch:after{content:'';position:absolute;left:9px;top:10px;width:12px;border-top:1px solid #60656e}.tree-table .last-child .branch:before{bottom:auto;height:28px}.tree-table .parent-summary{font-size:12px;color:var(--muted);line-height:1.7;margin-top:5px}.tree-toolbar{display:flex;gap:12px;align-items:center;margin:16px 0 12px;min-height:36px}.tree-toolbar .spacer{flex:1}.tree-toolbar strong{font-size:13px}.tree-table input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}.tree-table input:disabled{cursor:default}
.tag.unclassified{background:#512f33;color:#f5b6bb}.tag.pending{background:#383b42;color:#c5c8d0}.ai-values{display:flex;flex-wrap:wrap;gap:6px}.tree-title{flex-wrap:wrap}
.tree-table .tree-title button{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border:1px solid #62666e;border-radius:4px;padding:0;font-size:18px;font-weight:500;line-height:1;flex-shrink:0}
.tree-table .parent-row{cursor:pointer}.tree-table .parent-row:hover td{background:#40434a}.tree-table .parent-row:has(button:focus-visible) td{background:#3a4148}
</style>
<aside><div class="brand"><span>◈</span> MOSEMO</div><div class="muted" style="font-size:12px;padding:0 12px">화면</div><div class="nav">▦　관찰 타임라인</div><div class="nav active">☑　라벨 검토</div></aside>
<main><div class="notice">UI 프로토타입 · 예시 데이터 · 변경과 확정은 이 화면 안에서만 유지됩니다.</div><div class="top"><div><h1>라벨 검토</h1><p class="muted">이어진 활동을 묶어 보고, 각 구간의 내용을 확인해 라벨을 확정합니다.</p></div></div><div class="toolbar"><button class="quiet" disabled>‹</button><strong>2026. 9. 29.</strong><button class="quiet" disabled>›</button><span class="muted">Asia/Seoul</span><span class="spacer"></span><button onclick="reset()">예시 초기화</button></div><div class="bar"><h2>검토할 활동</h2><span id="count" class="muted"></span></div><p id="description" class="legend"></p><div id="groups"></div><div class="state"><strong>프로토타입 상태</strong><pre id="state"></pre></div></main>
<div class="switcher" aria-label="프로토타입 비교"><button class="cycle" onclick="cycle(-1)" aria-label="이전 안">←</button><button data-v="A" onclick="change('A')">A · 트리 테이블</button><button data-v="B" onclick="change('B')">B · 상세 카드</button><button data-v="C" onclick="change('C')">C · 상세 패널</button><button class="cycle" onclick="cycle(1)" aria-label="다음 안">→</button></div><div id="message" role="status"></div>
<script>
const labels=['코딩','학습','소통','쇼핑','여가','미분류'];
const sample=[{id:'g1',time:'16:09–16:32',ai:'코딩',expanded:true,selected:'s1',items:[
{id:'s1',kind:'app',time:'16:09:05–16:14:20',duration:'5분 15초',app:'Ghostty',title:'mosemo-server — API 서버 실행',window:'mosemo-server — uv run fastapi dev',tab:null,url:null,ai:'코딩',draft:'코딩',confirmed:false},
{id:'s2',kind:'web',time:'16:14:20–16:21:45',duration:'7분 25초',app:'Google Chrome',title:'FastAPI 공식 문서 · 의존성 주입',window:'Dependencies — FastAPI — Google Chrome',tab:'Dependencies — FastAPI',url:'https://fastapi.tiangolo.com/tutorial/dependencies/',ai:'코딩',draft:'코딩',confirmed:false},
{id:'s3',kind:'web',time:'16:21:45–16:32:10',duration:'10분 25초',app:'Google Chrome',title:'YouTube · 재즈 플레이리스트',window:'집중할 때 듣는 재즈 — YouTube — Google Chrome',tab:'집중할 때 듣는 재즈 — YouTube',url:'https://www.youtube.com/watch?v=example',ai:'코딩',draft:'코딩',confirmed:false}]},
{id:'g2',time:'16:32–16:38',ai:'소통',expanded:false,selected:'s4',items:[
{id:'s4',kind:'app',time:'16:32:10–16:36:40',duration:'4분 30초',app:'Slack',title:'팀 대화 · 오늘의 배포 일정',window:'#개발 — Mosemo — Slack',tab:null,url:null,ai:'소통',draft:'소통',confirmed:false},
{id:'s5',kind:'app',time:'16:36:40–16:38:05',duration:'1분 25초',app:'Mail',title:'창 제목을 수집하지 못한 구간',window:null,tab:null,url:null,ai:null,draft:'미분류',confirmed:false}]}];
let selectedIDs=new Set(); let groups=structuredClone(sample),variant=new URLSearchParams(location.search).get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=id=>groups.flatMap(g=>g.items).find(s=>s.id===id);
function badge(s){return `<span class="tag ${s.confirmed?'done':s.draft!==s.ai?'edited':'ai'}">${s.confirmed?'확정됨':s.draft!==s.ai?'수정됨':'AI 제안'}${s.confirmed?' · '+esc(s.draft):''}</span>`}
function contextFields(s){let title=s.kind==='web'?s.tab:s.window;return `<dt>제목</dt><dd>${title?esc(title):'<span class="missing">수집 불가</span>'}</dd>${s.kind==='web'?`<dt>URL</dt><dd class="url">${s.url?esc(s.url):'<span class="missing">수집 불가</span>'}</dd>`:''}`}
function contextFacts(s){return `<dl class="facts">${contextFields(s)}</dl>`}
function facts(s){return `<dl class="facts"><dt>${s.kind==='web'?'브라우저':'앱'}</dt><dd>${esc(s.app)}</dd>${contextFields(s)}<dt>시간</dt><dd>${s.time} · ${s.duration}</dd></dl>`}
function choice(s){return `<div class="choice"><span class="muted">AI 제안</span><span class="tag ai">${s.ai}</span><span class="arrow">→</span><label for="label-${s.id}">내 선택</label><select id="label-${s.id}" ${s.confirmed?'disabled':''} onchange="setLabel('${s.id}',this.value)">${labels.map(l=>`<option ${s.draft===l?'selected':''}>${l}</option>`).join('')}</select></div>`}
function action(s){return `<div class="actions"><span class="summary">${s.confirmed?'이 구간의 선택을 확정했습니다.':s.draft!==s.ai?'수정한 선택('+s.draft+')으로 확정합니다.':'AI 제안을 그대로 확정합니다.'}</span><span class="spacer"></span><button ${s.confirmed?'disabled':''} class="primary" onclick="confirmOne('${s.id}')">${s.confirmed?'확정 완료':'이 구간 확정'}</button></div>`}
function pendingItems(g){return g.items.filter(s=>!s.confirmed)}
function checkbox(id,items,label){let n=items.filter(s=>selectedIDs.has(s.id)).length;return `<input type="checkbox" data-selection="${id}" aria-label="${esc(label)}" ${items.length===0?'disabled':''} ${n>0&&n===items.length?'checked':''} onchange="toggleCheck('${id}')">`}
function aiValue(value){return `<span class="tag ${value?'ai':'pending'}">${value?esc(value):'진행 중'}</span>`}
function treeChild(s,last){return `<tr class="child-row ${last?'last-child':''} ${selectedIDs.has(s.id)?'selected-row':''}"><td>${checkbox(s.id,s.confirmed?[]:[s],s.title+' 선택')}</td><td><div class="time">${s.time.split('–').join('<br>– ')}<span class="duration">${s.duration}</span></div></td><td><div class="branch"><h3>${esc(s.title)}</h3><div class="parent-summary">${s.kind==='web'?'웹':'앱'} · ${esc(s.app)}</div>${contextFacts(s)}</div></td><td>${aiValue(s.ai)}</td><td><select id="label-${s.id}" aria-label="${esc(s.title)} 상태" ${s.confirmed?'disabled':''} onchange="setLabel('${s.id}',this.value)">${labels.map(l=>`<option ${s.draft===l?'selected':''}>${l}</option>`).join('')}</select></td><td><button class="primary" ${s.confirmed?'disabled':''} onclick="confirmOne('${s.id}')">${s.confirmed?'확정 완료':'이 구간 확정'}</button></td></tr>`}
function VariantA(){let all=groups.flatMap(pendingItems);return `<div class="tree-toolbar"><strong>${selectedIDs.size}개 구간 선택</strong><span class="muted">묶음 선택 시 하위 미확정 구간을 함께 선택합니다.</span><span class="spacer"></span><button class="primary" ${selectedIDs.size?'':'disabled'} onclick="confirmSelected()">선택한 ${selectedIDs.size}건 확정</button></div><div class="table-scroll"><table class="review-table tree-table" aria-label="묶음과 하위 구간 라벨 검토"><thead><tr><th scope="col">${checkbox('all',all,'전체 미확정 구간 선택')}</th><th scope="col">시간 · 길이</th><th scope="col">활동 · 상세 정보</th><th scope="col">AI 제안</th><th scope="col">상태</th><th scope="col">확정</th></tr></thead>${groups.map(g=>{let pending=pendingItems(g),counts={};g.items.forEach(s=>counts[s.draft]=(counts[s.draft]||0)+1);return `<tbody><tr class="parent-row" onclick="toggleGroupRow(event,'${g.id}')"><td>${checkbox(g.id,pending,g.time+' 묶음 선택')}</td><td><strong>${g.time}</strong></td><td><div class="tree-title"><button class="quiet" aria-label="${g.time} 묶음 ${g.expanded?'접기':'펼치기'}" aria-expanded="${g.expanded}" onclick="expand('${g.id}')">${g.expanded?'−':'+'}</button><h3>${g.ai} 활동 묶음</h3>${counts['미분류']?`<span class="tag unclassified">미분류 ${counts['미분류']}건</span>`:''}</div><div class="parent-summary" style="padding-left:33px">${g.items.length}개 구간 · ${[...new Set(g.items.map(s=>s.app))].map(esc).join(' · ')}</div></td><td><div class="ai-values">${[...new Set(g.items.map(s=>s.ai))].map(aiValue).join('')}</div></td><td><div class="parent-summary">${Object.entries(counts).map(([k,v])=>k+' '+v+'건').join('<br>')}</div></td><td><button class="primary" ${pending.length?'':'disabled'} onclick="confirmGroup('${g.id}')">${pending.length?'묶음 확정':'확정 완료'}</button></td></tr>${g.expanded?g.items.map((s,i)=>treeChild(s,i===g.items.length-1)).join(''):''}</tbody>`}).join('')}</table></div>`}

function toggleGroupRow(event,id){if(event.target.closest('button,input,select,a,label'))return;expand(id)}
function toggleCheck(id){let items=id==='all'?groups.flatMap(pendingItems):id.startsWith('g')?pendingItems(groups.find(g=>g.id===id)):[get(id)];let checked=items.every(s=>selectedIDs.has(s.id));items.forEach(s=>checked?selectedIDs.delete(s.id):selectedIDs.add(s.id));render()}
function updateChecks(){document.querySelectorAll('[data-selection]').forEach(el=>{let id=el.dataset.selection,items=id==='all'?groups.flatMap(pendingItems):id.startsWith('g')?pendingItems(groups.find(g=>g.id===id)):[get(id)].filter(s=>!s.confirmed),n=items.filter(s=>selectedIDs.has(s.id)).length;el.indeterminate=n>0&&n<items.length;el.setAttribute('aria-checked',el.indeterminate?'mixed':String(el.checked))})}
function confirmSelected(){selectedIDs.forEach(id=>get(id).confirmed=true);selectedIDs.clear();render();notify('예시: 선택한 구간을 각 구간의 선택 라벨대로 확정했습니다.')}

function VariantB(g){return `<div class="cards">${g.items.map(s=>`<article class="card"><div class="item-head"><div class="identity"><h3>${esc(s.title)}</h3><div class="time">${s.time} · ${s.duration}</div></div>${badge(s)}</div>${facts(s)}${choice(s)}${action(s)}</article>`).join('')}</div>`}
function VariantC(g){let s=g.items.find(s=>s.id===g.selected)||g.items[0];return `<div class="split"><div class="segment-list">${g.items.map(i=>`<button class="segment-button ${i.id===s.id?'current':''}" onclick="selectSegment('${g.id}','${i.id}')"><span class="time">${i.time} · ${i.duration}</span><strong>${esc(i.title)}</strong><span class="muted">${esc(i.app)} · 내 선택 ${i.draft}</span><br>${badge(i)}</button>`).join('')}</div><section class="inspector"><div class="item-head"><div class="identity"><h3>${esc(s.title)}</h3><p>${esc(s.app)}</p></div>${badge(s)}</div>${facts(s)}${choice(s)}${action(s)}<div class="actions"><span class="spacer"></span><button onclick="nextSegment('${g.id}')">다음 구간 →</button></div></section></div>`}
function render(){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===variant));document.querySelector('#description').textContent={A:'A · 묶음과 하위 구간을 하나의 테이블에 표시합니다. 왼쪽 체크박스로 묶음 또는 개별 구간을 선택합니다.',B:'B · 묶음 아래에 구간별 상세 카드를 표시합니다. 문맥 정보와 라벨 선택을 한눈에 비교합니다.',C:'C · 묶음 안에서 왼쪽 구간을 선택하면 오른쪽에 전체 상세 정보와 라벨 수정 기능을 표시합니다.'}[variant];document.querySelector('#count').textContent=`${groups.length}개 묶음 · ${groups.flatMap(g=>g.items).filter(s=>!s.confirmed).length}개 구간 미확정`;document.querySelector('#groups').innerHTML=variant==='A'?VariantA():groups.map(g=>{let pending=g.items.filter(s=>!s.confirmed),counts={};g.items.forEach(s=>counts[s.draft]=(counts[s.draft]||0)+1);return `<section class="group"><div class="group-head"><button class="quiet" onclick="expand('${g.id}')" aria-expanded="${g.expanded}" aria-label="묶음 ${g.expanded?'접기':'펼치기'}">${g.expanded?'⌄':'›'}</button><div class="group-title"><h3>${g.time} · AI 제안 ${g.ai}</h3><small>${g.items.length}개 구간 · ${pending.length}개 미확정</small></div><span class="summary">내 선택　${Object.entries(counts).map(([k,v])=>k+' '+v+'건').join(' · ')}</span><span class="spacer"></span><button class="primary" ${pending.length?'':'disabled'} onclick="confirmGroup('${g.id}')">${pending.length?'미확정 '+pending.length+'건 선택대로 확정':'모두 확정됨'}</button><button class="quiet" onclick="expand('${g.id}')">${g.expanded?'접기':'구간 펼치기'}</button></div>${g.expanded?`<div class="content">${({A:VariantA,B:VariantB,C:VariantC}[variant])(g)}</div>`:''}</section>`}).join('');updateChecks();document.querySelector('#state').textContent=JSON.stringify({variant,selectedSegmentIDs:[...selectedIDs],groups:groups.map(g=>({id:g.id,expanded:g.expanded,selected:g.selected,segments:g.items.map(s=>({id:s.id,ai:s.ai,choice:s.draft,confirmed:s.confirmed}))}))},null,2)}
function expand(id){let g=groups.find(g=>g.id===id);g.expanded=!g.expanded;render()}
function setLabel(id,value){let s=get(id);s.draft=value;render()}
function selectSegment(gid,id){groups.find(g=>g.id===gid).selected=id;render()}
function nextSegment(gid){let g=groups.find(g=>g.id===gid),index=g.items.findIndex(s=>s.id===g.selected);g.selected=g.items[(index+1)%g.items.length].id;render()}
let timer;function notify(msg){let el=document.querySelector('#message');el.className='toast';el.textContent=msg;clearTimeout(timer);timer=setTimeout(()=>el.textContent='',3000)}
function confirmOne(id){get(id).confirmed=true;selectedIDs.delete(id);render();notify('예시: 이 구간의 라벨을 확정했습니다.')}
function confirmGroup(id){groups.find(g=>g.id===id).items.forEach(s=>{s.confirmed=true;selectedIDs.delete(s.id)});render();notify('예시: 각 구간에서 선택한 라벨대로 확정했습니다.')}
function reset(){groups=structuredClone(sample);selectedIDs.clear();render()}
function change(v){variant=v;let url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);render()}
function cycle(dir){let keys=['A','B','C'];change(keys[(keys.indexOf(variant)+dir+3)%3])}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('popstate',()=>{variant=new URLSearchParams(location.search).get('variant')||'A';render()});render();
</script>
</html>
