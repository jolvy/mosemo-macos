<main><div class="notice">UI 프로토타입 · 예시 데이터 · 목록과 시간축은 동일한 선택 구간과 우측 상세 패널을 공유합니다.</div><h1>관찰 타임라인</h1><p class="muted">하루의 활동과 관찰하지 못한 시간을 살펴봅니다.</p><div class="toolbar"><button disabled>‹</button><strong>2026. 9. 29.</strong><button disabled>›</button><span class="muted" style="font-size:12px">Asia/Seoul 기준</span><span class="spacer"></span><span class="muted">보기</span><div class="mode"><button id="mode-list" onclick="setMode('list')">목록</button><button id="mode-axis" onclick="setMode('axis')">시간축</button></div></div><div class="workspace"><section><div class="section-head"><h2>2026-09-29</h2><span>5개 구간</span></div><div id="timeline"></div></section><section id="inspector" class="inspector" aria-label="타임라인 상세"></section></div><details class="state"><summary>프로토타입 상태</summary><pre id="state"></pre></details></main>

<script>
const blocks=[
{id:'coding',label:'코딩',type:'confirmed',start:'16:09:05',end:'16:32:10',duration:'00:23:05',subtitle:'Ghostty · Google Chrome',items:[
{kind:'app',app:'Ghostty',start:'16:09:05',end:'16:14:20',duration:'00:05:15',title:'mosemo-server — uv run fastapi dev'},
{kind:'web',app:'Google Chrome',start:'16:14:20',end:'16:21:45',duration:'00:07:25',title:'Dependencies — FastAPI',url:'https://fastapi.tiangolo.com/tutorial/dependencies/'},
{kind:'web',app:'Google Chrome',start:'16:21:45',end:'16:32:10',duration:'00:10:25',title:'Mosemo · GitHub Pull requests',url:'https://github.com/jolvy/mosemo-server/pulls'}]},
{id:'learning',label:'학습',type:'confirmed',start:'16:32:10',end:'17:05:00',duration:'00:32:50',subtitle:'Google Chrome · Notes',items:[
{kind:'web',app:'Google Chrome',start:'16:32:10',end:'16:52:00',duration:'00:19:50',title:'SwiftUI · Apple Developer Documentation',url:'https://developer.apple.com/documentation/swiftui'},
{kind:'app',app:'Notes',start:'16:52:00',end:'17:05:00',duration:'00:13:00',title:'SwiftUI 학습 메모'}]},
{id:'gap',label:'수집 공백',type:'gap',start:'17:05:00',end:'17:15:00',duration:'00:10:00',subtitle:'활동 추적을 잠시 중지했습니다.',items:[]},
{id:'opaque',label:'보호된 활동',type:'opaque',start:'17:15:00',end:'17:30:00',duration:'00:15:00',subtitle:'개인정보 보호로 상세 정보가 가려졌습니다.',items:[]},
{id:'pending',label:'미확정',type:'pending',proposal:'소통',start:'17:30:00',end:'17:55:00',duration:'00:25:00',subtitle:'Slack · Mail',items:[

{kind:'app',app:'Mail',start:'17:47:00',end:'17:55:00',duration:'00:08:00',title:null}]}];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let variant=new URLSearchParams(location.search).get('variant')||'A',mode='list',selected='coding';if(!['A','B','C'].includes(variant))variant='A';
const minute=t=>{const [h,m,s]=t.split(':').map(Number);return h*60+m+s/60};
const tag=b=>`<span class="pill ${b.type}">${esc(b.label)}</span>`;
function itemFacts(i){return `<dl class="facts"><dt>제목</dt><dd>${i.title?esc(i.title):'<span class="muted">수집 불가</span>'}</dd>${i.kind==='web'?`<dt>URL</dt><dd class="url">${esc(i.url)}</dd>`:''}</dl>`}
function itemIdentity(i){return `${i.kind==='web'?'웹':'앱'} · ${esc(i.app)}`}
function itemTime(i){return `<div class="time">${i.start}–${i.end}<br>${i.duration}</div>`}
function VariantA(b){return `<div class="detail-table-scroll"><table class="detail-table item-columns"><thead><tr><th scope="col">총</th><th scope="col">시작시간</th><th scope="col">종료시간</th><th scope="col">종류</th><th scope="col">상세정보</th></tr></thead><tbody>${b.items.map(i=>`<tr><td>${i.duration}</td><td>${i.start}</td><td>${i.end}</td><td>${i.kind==='web'?'웹':'앱'}</td><td><div class="item-title">${i.title?esc(i.title):'<span class="muted">수집 불가</span>'}</div>${i.kind==='web'?`<div class="item-url">${esc(i.url)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function VariantB(b){return b.items.map(i=>`<article class="item-card"><div class="rowline"><h3>${esc(i.app)}</h3><span class="pill gap">${i.kind==='web'?'웹':'앱'}</span></div>${itemTime(i)}${itemFacts(i)}</article>`).join('')}
function VariantC(b){return b.items.map(i=>`<details class="item-entry" open><summary><div><h3>${i.title?esc(i.title):'제목 수집 불가'}</h3><div class="app-name">${itemIdentity(i)}</div>${itemTime(i)}</div></summary>${itemFacts(i)}</details>`).join('')}
function intervalText(b){const startDate=b.startDate||'2026-09-29',endDate=b.endDate||startDate;const dateText=date=>{const [year,month,day]=date.split('-');return `${year}. ${Number(month)}. ${Number(day)}.`};return `${dateText(startDate)} ${b.start} – ${endDate!==startDate?dateText(endDate)+' ':''}${b.end}`}
function inspector(){const b=blocks.find(b=>b.id===selected);document.querySelector('#inspector').innerHTML=`<div class="summary summary-row"><div class="summary-time"><div class="muted" style="font-size:12px">총 시간</div><div class="duration" style="margin-top:5px">${b.duration}</div><div class="range">${intervalText(b)}</div></div><div class="summary-label"><div>${tag(b)}${b.proposal?`<p class="muted" style="font-size:12px">AI 제안 · ${b.proposal}</p>`:''}</div></div></div><div class="items"><div class="items-head"><strong>타임라인</strong><span>${b.items.length}개 항목</span></div>${b.items.length?({A:VariantA,B:VariantB,C:VariantC}[variant])(b):`<div class="special">${b.type==='gap'?'이 구간에는 관찰된 항목이 없습니다.<br>활동 추적을 중지한 시간입니다.':'개인정보 보호로 앱·제목·URL을 표시하지 않습니다.'}</div>`}</div>`}
function renderTimeline(){document.querySelector('#timeline').innerHTML=mode==='list'?`<div class="timeline-list">${blocks.map(b=>`<button class="timeline-row ${b.id===selected?'selected':''}" aria-pressed="${b.id===selected}" onclick="selectBlock('${b.id}')"><span class="meta">${b.start.slice(0,5)}–${b.end.slice(0,5)}</span><span><h3>${tag(b)}</h3><small>${esc(b.subtitle)}</small></span><span class="total">${b.duration}</span></button>`).join('')}</div>`:`<div class="axis-scroll"><div class="axis">${Array.from({length:24},(_,h)=>`<div class="tick" style="top:${h*110}px"><span>${String(h).padStart(2,'0')}:00</span></div>`).join('')}${blocks.map(b=>`<button class="axis-block ${b.type} ${b.id===selected?'selected':''}" aria-label="${b.label} ${b.start}–${b.end}" aria-pressed="${b.id===selected}" style="top:${minute(b.start)*110/60}px;height:${(minute(b.end)-minute(b.start))*110/60}px" onclick="selectBlock('${b.id}')">${b.label} · ${b.duration}<div class="meta">${b.start.slice(0,5)}–${b.end.slice(0,5)}</div></button>`).join('')}</div></div>`;if(mode==='axis')document.querySelector('.axis-scroll').scrollTop=15.6*110}
function render(){document.querySelectorAll('[data-variant]').forEach(el=>el.classList.toggle('active',el.dataset.variant===variant));document.querySelector('#mode-list').classList.toggle('active',mode==='list');document.querySelector('#mode-axis').classList.toggle('active',mode==='axis');renderTimeline();inspector();updateState()}
function updateState(){let b=blocks.find(b=>b.id===selected);document.querySelector('#state').textContent=JSON.stringify({variant,view:mode,selectedTimelineBlock:b.id,label:b.type==='confirmed'?b.label:null,confirmation:b.type,duration:b.duration,start:b.start,end:b.end,items:b.items},null,2)}
function selectBlock(id){selected=id;document.querySelectorAll('.timeline-row,.axis-block').forEach(el=>{let active=el.getAttribute('onclick')===`selectBlock('${id}')`;el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active))});inspector();updateState()}
function setMode(value){mode=value;render()}
function setVariant(value){variant=value;let url=new URL(location.href);url.searchParams.set('variant',value);history.replaceState(null,'',url);render()}
function cycle(dir){const keys=['A','B','C'];setVariant(keys[(keys.indexOf(variant)+dir+3)%3])}
window.addEventListener('popstate',()=>{variant=new URLSearchParams(location.search).get('variant')||'A';render()});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></html>
